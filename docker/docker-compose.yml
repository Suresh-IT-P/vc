# ---------------------------------------------------------------------------
# Sonder — local infrastructure.
#
# There is no database service. Sonder uses SQLite, so the database is a file on
# a volume inside the server container — nothing to start, and `npm run dev`
# needs none of this.
#
#   docker compose -f docker/docker-compose.yml --profile turn up -d
#     coturn only. Needed to test calls between peers on different networks;
#     STUN alone fails behind symmetric NAT (most mobile carriers).
#
#   docker compose -f docker/docker-compose.yml --profile full up -d --build
#     Everything: the app containers behind Nginx.
#
# Values here are development defaults and are deliberately weak. Override every
# secret before this goes anywhere near a public network.
# ---------------------------------------------------------------------------
name: sonder

services:
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: sonder-coturn
    restart: unless-stopped
    profiles: ['turn', 'full']
    # Host networking: TURN allocates a wide UDP port range, and publishing
    # thousands of ports through the Docker proxy is both slow and unreliable.
    network_mode: host
    command:
      - --listening-port=3478
      - --tls-listening-port=5349
      - --fingerprint
      # REST-API credentials: the server mints short-lived HMAC usernames rather
      # than handing out a static password. Must match TURN_SECRET in .env.
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-change-me-turn-secret}
      - --realm=${TURN_REALM:-sonder.local}
      # relay-ip must be the address peers can actually reach. On a cloud host
      # set EXTERNAL_IP to the public address, or relaying will silently fail.
      - --external-ip=${EXTERNAL_IP:-127.0.0.1}
      - --min-port=49160
      - --max-port=49200
      # Refuse to relay to loopback/private ranges: an open relay is abused fast.
      - --no-loopback-peers
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --no-cli
      - --log-file=stdout
      - --simple-log

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: sonder-server
    restart: unless-stopped
    profiles: ['full']
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      # An absolute path on the named volume below. The container's entrypoint
      # runs `prisma migrate deploy` against it before serving, so a first start
      # creates the schema and later starts apply any new migrations.
      DATABASE_URL: file:/data/sonder.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STUN_SERVERS: ${STUN_SERVERS:-stun:stun.l.google.com:19302}
      TURN_SERVER: ${TURN_SERVER:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_REALM: ${TURN_REALM:-sonder.local}
    ports:
      - '4000:4000'
    volumes:
      # The whole database. Losing this volume loses every account, message and
      # call record, so back it up: `docker compose cp server:/data/sonder.db .`
      # (see docs/database.md for a consistent online backup).
      - sonder-data:/data

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:4000}
    container_name: sonder-web
    restart: unless-stopped
    profiles: ['full']
    depends_on:
      - server
    ports:
      - '3000:3000'

  nginx:
    image: nginx:1.27-alpine
    container_name: sonder-nginx
    restart: unless-stopped
    profiles: ['full']
    depends_on:
      - web
      - server
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/sonder.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certs:/etc/nginx/certs:ro

volumes:
  sonder-data:
