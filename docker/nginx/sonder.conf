# ---------------------------------------------------------------------------
# Sonder — Nginx reverse proxy.
#
# WHY HTTPS IS NOT OPTIONAL
# getUserMedia() only works on a secure context. Over plain HTTP (other than
# http://localhost, which browsers exempt) the microphone request is rejected
# outright, so calls cannot be placed at all. TLS here is a functional
# requirement, not hardening.
#
# Serving the web app and the API from one origin also removes the cross-site
# cookie problem: the refresh cookie can stay SameSite=Lax instead of needing
# SameSite=None.
# ---------------------------------------------------------------------------

upstream sonder_web {
    server web:3000;
    keepalive 32;
}

upstream sonder_api {
    server server:4000;
    keepalive 32;
}

# WebSocket upgrade only when the client actually asked for it. Sending
# `Connection: upgrade` on every request breaks keepalive to the upstream.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME HTTP-01 challenge has to stay on port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SonderTLS:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://sonder_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The server trusts this for rate limiting, so it must be set here and
        # not passed through from the client.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://sonder_api/health;
        access_log off;
    }

    # --- Socket.IO ---------------------------------------------------------
    # Call signalling lives here. The long read timeout matters: a silent
    # WebSocket on a quiet call must not be reaped mid-conversation.
    location /socket.io/ {
        proxy_pass http://sonder_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # --- Web app -----------------------------------------------------------
    # Immutable build output: content-hashed, so cache it hard.
    location /_next/static/ {
        proxy_pass http://sonder_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The AudioWorklet bundle is NOT content-hashed, so it must revalidate or a
    # stale DSP build would keep running after a deploy.
    location /worklets/ {
        proxy_pass http://sonder_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate";
        types { }
        default_type application/javascript;
    }

    location /media/ {
        proxy_pass http://sonder_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://sonder_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
